<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Under Construction</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17221f;
      --muted: #66716d;
      --paper: #f5f1e8;
      --panel: #fffdf8;
      --accent: #e96f3d;
      --line: #ded8ca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: Georgia, 'Times New Roman', serif;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 72px);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 12px 12px 0 var(--accent);
      animation: appear 600ms ease-out both;
    }

    .mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      color: var(--panel);
      background: var(--ink);
      border-radius: 50%;
      font: 700 28px/1 Arial, sans-serif;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font: 700 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 520px;
      margin: 0 auto;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      font-weight: 400;
    }

    p {
      max-width: 410px;
      margin: 24px auto 0;
      color: var(--muted);
      font: 16px/1.7 Arial, sans-serif;
    }

    .rule {
      height: 1px;
      margin: 34px auto 20px;
      background: var(--line);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font: 700 11px/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status::before {
      width: 8px;
      height: 8px;
      content: '';
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(233, 111, 61, 0.15);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 16px;
      }

      main {
        box-shadow: 7px 7px 0 var(--accent);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">+</div>
    <p class="eyebrow">A new chapter is taking shape</p>
    <h1>Site under construction</h1>
    <p>We are putting the finishing touches in place. Please check back soon for something worth the wait.</p>
    <div class="rule"></div>
    <div class="status">Currently building</div>
  </main>
</body>
</html>
